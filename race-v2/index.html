<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Top-Down Car Racing</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0f1a; font-family: sans-serif; }
  #canvasWrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #ui {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column;
  }
  #top { position: absolute; top: 0; left: 0; right: 0; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; box-sizing: border-box; }
  #score { font-size: 20px; color: #ffdd44; }
  #speed { font-size: 16px; color: #fff; }
  #startScreen {
    pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; flex: 1; text-align: center;
  }
  #title { font-size: clamp(30px, 9vw, 56px); color: #fff; margin: 0; }
  #subtitle { font-size: clamp(16px, 4vw, 24px); color: #ccc; margin: 0; }
  #startHint { font-size: clamp(12px, 3vw, 18px); color: #aaa; margin: 0; line-height: 1.5; max-width: 320px; padding: 0 16px; }
  #gameOver {
    pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; flex: 1; text-align: center;
  }
  #finalScore { font-size: clamp(36px, 10vw, 64px); color: #ffdd44; margin: 0; }
  #restartText { font-size: clamp(14px, 3vw, 18px); color: #ccc; margin: 0; }
  #restartBtn {
    padding: 14px 40px; font-size: clamp(18px, 5vw, 26px); color: #fff; background: #ffdd44;
    border: none; border-radius: 12px; cursor: pointer;
  }
  #steerButtons {
    position: absolute; bottom: 0; left: 0; right: 0; height: 82px;
    display: flex; justify-content: space-between; padding: 0 16px; box-sizing: border-box;
    pointer-events: none; z-index: 10;
  }
  .steerBtn {
    width: 100%; height: 82px; font-size: 34px; color: #fff; background: rgba(0,0,0,0.6);
    border: 4px solid #fff; border-radius: 18px; cursor: pointer; touch-action: manipulation;
    pointer-events: auto;
  }
  #steerBtnLeft { border-right-color: #4a90d9; }
  #steerBtnRight { border-left-color: #d94a4a; }
</style>
</head>
<body>
<div id="canvasWrap">
  <canvas id="game"></canvas>
  <div id="ui">
    <div id="top">
      <div id="score">0</div>
      <div id="speed">0 km/h</div>
    </div>
    <div id="startScreen">
      <h1 id="title">Top-Down Car Racing</h1>
      <p id="subtitle">Steer left and right to dodge traffic!</p>
      <p id="startHint">Laptop: Arrow keys or A/D<br>Phone: Hold LEFT/RIGHT buttons<br>Press any key, click or tap to start</p>
    </div>
    <div id="gameOver">
      <h1 style="color:#ffdd44; margin:0 0 12px;">Game Over</h1>
      <div id="finalScore">0</div>
      <p id="restartText">Tap or press Space/Enter to restart</p>
      <button id="restartBtn">Restart</button>
    </div>
    <div id="steerButtons">
      <button class="steerBtn" id="steerBtnLeft">LEFT</button>
      <button class="steerBtn" id="steerBtnRight">RIGHT</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

const roadLanes = 3;
const laneWidth = W / roadLanes;
let playerX = W / 2;
let playerY = H - 120;
let score = 0;
let speed = 3;
let gameOver = false;
let gameStarted = false;
let lastTime = performance.now();

let traffic = [];
let obstacles = [];

let touchLeft = false;
let touchRight = false;

const keys = {};
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if ((e.key === ' ' || e.key === 'enter') && !gameStarted) startGame();
  if ((e.key === ' ' || e.key === 'enter') && gameOver) restartGame();
  if (k === 'left' || k === 'a') touchLeft = true;
  if (k === 'right' || k === 'd') touchRight = true;
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === 'left' || k === 'a') touchLeft = false;
  if (k === 'right' || k === 'd') touchRight = false;
});

document.getElementById('restartBtn').addEventListener('click', () => {
  if (gameOver) restartGame();
});

document.getElementById('steerBtnLeft').addEventListener('touchstart', () => { touchLeft = true; }, { passive: true });
document.getElementById('steerBtnLeft').addEventListener('touchend', () => { touchLeft = false; });
document.getElementById('steerBtnLeft').addEventListener('touchcancel', () => { touchLeft = false; });
document.getElementById('steerBtnRight').addEventListener('touchstart', () => { touchRight = true; }, { passive: true });
document.getElementById('steerBtnRight').addEventListener('touchend', () => { touchRight = false; });
document.getElementById('steerBtnRight').addEventListener('touchcancel', () => { touchRight = false; });

document.getElementById('steerBtnLeft').addEventListener('mousedown', () => { touchLeft = true; });
document.getElementById('steerBtnRight').addEventListener('mousedown', () => { touchRight = true; });
window.addEventListener('mouseup', () => {
  touchLeft = false;
  touchRight = false;
});

window.addEventListener('touchstart', () => {
  if (!gameStarted) startGame();
  if (gameOver) restartGame();
}, { passive: true });

window.addEventListener('mousedown', () => {
  if (!gameStarted) startGame();
  if (gameOver) restartGame();
});

function startGame() {
  gameStarted = true;
  score = 0;
  speed = 3;
  playerX = W / 2;
  gameOver = false;
  playerY = H - 120;
  traffic = [];
  obstacles = [];
  lastTime = performance.now();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOver').style.display = 'none';
}

function restartGame() {
  startGame();
  document.getElementById('gameOver').style.display = 'none';
}

function update() {
  if (!gameStarted || gameOver) return;

  const now = performance.now();
  const dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;

  const move = speed * dt;

  playerX += (touchRight || keys['d'] || keys['right']) ? 60 * dt : 0;
  playerX -= (touchLeft || keys['a'] || keys['left']) ? 60 * dt : 0;
  playerX = Math.max(30, Math.min(W - 30, playerX));

  playerY += move;
  if (playerY > H - 80) playerY = H - 80;

  traffic.forEach(t => t.y += move);
  traffic = traffic.filter(t => t.y < H);
  obstacles.forEach(o => o.y += move);
  obstacles = obstacles.filter(o => o.y < H);

  if (Math.random() < 0.015) {
    obstacles.push({ y: -60, x: Math.random() * W, width: 40 + Math.random() * 40, type: 'ob' });
  }
  if (Math.random() < 0.008) {
    traffic.push({ y: -100, x: Math.random() * W, type: 'car' });
  }

  score += move / 10;
  speed = 3 + Math.min(score * 0.02, 12);

  checkCollisions();

  if (playerY > H - 40) gameOver = true;
}

function checkCollisions() {
  if (gameOver) return;
  const carWidth = 45;
  for (const t of traffic) {
    if (Math.abs(t.x - playerX) < carWidth / 2 + 22 && Math.abs(t.y - playerY) < 35) {
      gameOver = true;
      return;
    }
  }
  for (const o of obstacles) {
    if (Math.abs(o.x - playerX) < o.width / 2 + 22 && Math.abs(o.y - playerY) < 35) {
      gameOver = true;
      return;
    }
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  const roadTop = -200;
  const roadBottom = H + 100;
  for (let i = 0; i < roadLanes; i++) {
    ctx.fillStyle = '#1a2433';
    ctx.fillRect(i * laneWidth, roadTop, laneWidth, H - roadTop + roadBottom);
    ctx.strokeStyle = '#3a4a5a';
    ctx.lineWidth = 2;
    ctx.strokeRect(i * laneWidth, roadTop, laneWidth, H - roadTop + roadBottom);
    if (i % 2 === 1) {
      ctx.strokeStyle = '#2a3a4a';
      for (let j = roadTop; j < roadBottom; j += 50) {
        ctx.beginPath();
        ctx.moveTo(i * laneWidth + 5, j);
        ctx.lineTo(i * laneWidth - 5, j);
        ctx.stroke();
      }
    }
  }

  for (const o of obstacles) {
    ctx.fillStyle = o.type === 'ob' ? '#d94a4a' : '#333';
    ctx.fillRect(o.x - o.width / 2, o.y - 20, o.width, 40);
  }

  for (const t of traffic) {
    const color = t.type === 'car' ? '#888' : '#d94a4a';
    ctx.fillStyle = color;
    ctx.fillRect(t.x - 20, t.y - 30, 40, 60);
    ctx.fillRect(t.x - 22, t.y - 22, 44, 18);
    ctx.fillRect(t.x - 10, t.y + 30, 20, 20);
    for (let i = 0; i < 2; i++) {
      ctx.fillStyle = '#111';
      ctx.fillRect(t.x - 6 + i * 30, t.y - 8, 6, 4);
      ctx.fillRect(t.x - 6 + i * 30, t.y + 24, 6, 4);
    }
  }

  ctx.fillStyle = '#ffdd44';
  ctx.fillRect(playerX - 20, playerY - 25, 40, 10);
  ctx.fillRect(playerX - 20, playerY - 15, 10, 18);
  ctx.fillRect(playerX + 2, playerY - 15, 10, 18);
  ctx.fillRect(playerX + 18, playerY - 30, 24, 8);

  if (gameOver) {
    ctx.fillStyle = 'rgba(10, 15, 26, 0.8)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffdd44';
    ctx.font = 'bold 60px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 60);
    ctx.font = '40px sans-serif';
    ctx.fillText('Score: ' + Math.round(score), W / 2, H / 2 + 20);
  }
}

function renderUI() {
  const scoreEl = document.getElementById('score');
  scoreEl.textContent = Math.round(score);
  const speedEl = document.getElementById('speed');
  speedEl.textContent = Math.round(speed * 3.6) + ' km/h';
  document.getElementById('startScreen').style.display = gameStarted ? 'none' : 'flex';
  document.getElementById('gameOver').style.display = gameOver && gameStarted ? 'flex' : 'none';
}

function loop() {
  update();
  draw();
  renderUI();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
