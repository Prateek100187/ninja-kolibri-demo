<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lawn Tennis</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a3d2e; font-family: 'Helvetica Neue', Arial, sans-serif; }
* { box-sizing: border-box; }
canvas { display: block; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(26,61,46,0.92); color: #fff; text-align: center; }
#canvasWrapper { position: absolute; inset: 0; width: 100%; height: 100%; }
#courtCanvas { display: block; }
#buttons { position: absolute; bottom: 2vh; left: 50%; transform: translateX(-50%); display: flex; gap: 2vh; padding: 1vh; background: rgba(0,0,0,0.5); border-radius: 12px; }
button { width: 14vw; min-width: 90px; height: 14vh; min-height: 96px; border-radius: 24px; border: 3px solid #fff; background: rgba(255,255,255,0.12); color: #fff; font-size: 5vh; font-weight: bold; transition: transform 0.1s; }
button:active { transform: scale(0.92); box-shadow: 0 0 20px rgba(255,255,255,0.4); }
#restartBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 25vw; min-width: 120px; height: 18vh; min-height: 120px; font-size: 6vh; }
#score { position: absolute; top: 3vh; left: 50%; transform: translateX(-50%); font-size: 6vw; font-weight: bold; background: rgba(0,0,0,0.6); padding: 1vh 3vw; border-radius: 12px; }
</style>
</head>
<body>
<div id="canvasWrapper">
  <canvas id="courtCanvas"></canvas>
</div>
<div id="score">0 - 0</div>

<div class="screen" id="startScreen">
  <h1>Lawn Tennis</h1>
  <p>First to 3 games wins.</p>
  <p>Laptop: ←/→ or A/D move, Space swing, Enter start.</p>
  <p>Phone: LEFT/RIGHT/SWING buttons, tap to play.</p>
  <div id="restartBtn">START</div>
</div>

<div class="screen" id="gameOverScreen" style="display:none;">
  <h1>Game Over</h1>
  <p id="winnerText">Player won!</p>
  <p id="finalScore">3 - 0</p>
  <button id="restartBtn2">RESTART</button>
</div>

<div id="buttons">
  <button id="btnLeft">LEFT</button>
  <button id="btnRight">RIGHT</button>
  <button id="btnSwing">SWING</button>
</div>

<script>
const canvas = document.getElementById('courtCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let playerX = W / 2, playerY = H - 80;
let opponentX = W / 2, opponentY = 80;
let ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, inPlay: false, bounces: 0, size: 12 };
let playerRacketAngle = 0;
let swinging = false;
let swingingTimer = 0;
let swingCooldown = 0;
let gameState = 'start'; // start, playing, gameover
let playerScore = 0, opponentScore = 0;
let gamesWon = { player: 0, opponent: 0 };
let currentGame = { player: 0, opponent: 0 };
let lastTime = 0;
let lastBallX = W / 2, lastBallY = H / 2;

const TENNIS_COURT_W = W * 0.85;
const TENNIS_COURT_H = H * 0.55;
const NET_Y = TENNIS_COURT_H / 2;
const NET_HEIGHT = 1.05;

function worldToScreen(x, y) {
  const offsetX = (W - TENNIS_COURT_W) / 2;
  const offsetY = (H - TENNIS_COURT_H) / 2;
  return { sx: offsetX + x, sy: offsetY + y };
}

function drawCourt() {
  ctx.clearRect(0, 0, W, H);
  const { sx: cx, sy } = worldToScreen(0, 0);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 6;
  ctx.strokeRect(cx, sy, TENNIS_COURT_W, TENNIS_COURT_H);
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(cx + TENNIS_COURT_W / 2, sy);
  ctx.lineTo(cx + TENNIS_COURT_W / 2, sy + TENNIS_COURT_H);
  ctx.stroke();
  ctx.strokeStyle = '#fff';
  ctx.beginPath();
  ctx.moveTo(cx + TENNIS_COURT_W * 0.25, sy);
  ctx.lineTo(cx + TENNIS_COURT_W * 0.75, sy);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + TENNIS_COURT_W * 0.25, sy + TENNIS_COURT_H);
  ctx.lineTo(cx + TENNIS_COURT_W * 0.75, sy + TENNIS_COURT_H);
  ctx.stroke();
}

function drawBall() {
  const { sx, sy } = worldToScreen(ball.x, ball.y);
  const shadow = -ball.vy * 0.5;
  ctx.fillStyle = 'rgba(255, 255, 0, 0.4)';
  ctx.beginPath();
  ctx.arc(sx, sy + shadow + 5, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffea00';
  ctx.beginPath();
  ctx.arc(sx, sy + shadow, ball.size, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayer(x, y, color) {
  const { sx, sy } = worldToScreen(x, y);
  ctx.strokeStyle = color;
  ctx.lineWidth = 18;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sx, sy - 30);
  ctx.lineTo(sx - 12, sy - 10);
  ctx.lineTo(sx, sy - 5);
  ctx.lineTo(sx - 12, sy + 10);
  ctx.lineTo(sx, sy + 30);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(sx, sy - 35, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(sx - 18, sy - 30, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.3)';
  ctx.lineWidth = 5;
  ctx.beginPath();
  ctx.moveTo(sx, sy - 35);
  ctx.lineTo(sx, sy + 40);
  ctx.stroke();
}

function drawRacket(sx, sy, angle, color) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(angle);
  ctx.strokeStyle = color;
  ctx.lineWidth = 12;
  ctx.beginPath();
  ctx.moveTo(0, -25);
  ctx.lineTo(55, 0);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(55, 0, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawNet() {
  const { sx, sy } = worldToScreen(0, 0);
  const netX = sx + TENNIS_COURT_W / 2;
  const netTop = sy + NET_Y - NET_HEIGHT / 2;
  const netBottom = sy + NET_Y + NET_HEIGHT / 2;
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(netX - 4, netTop, 8, NET_HEIGHT);
  ctx.strokeStyle = 'rgba(255,255,255,0.8)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(netX - 4, netTop);
  ctx.lineTo(netX - 4, netBottom);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(netX + 4, netTop);
  ctx.lineTo(netX + 4, netBottom);
  ctx.stroke();
}

function updateBall() {
  const { sx, sy } = worldToScreen(ball.x, ball.y);
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.vy += 2500; // gravity in px/s^2
  const bounceY = sy + TENNIS_COURT_H - ball.size;
  if (ball.y >= bounceY) {
    ball.y = bounceY;
    ball.vy = -ball.vy * 0.75;
    ball.bounces++;
    if (ball.bounces > 2) gameState = 'gameover';
  }
  const netCenterY = sy + NET_Y;
  if (ball.x > sx + TENNIS_COURT_W / 2 - ball.size && ball.x < sx + TENNIS_COURT_W / 2 + ball.size) {
    if (ball.y > netCenterY - NET_HEIGHT / 2 && ball.y < netCenterY + NET_HEIGHT / 2) {
      ball.x = sx + TENNIS_COURT_W / 2;
      ball.vy = -ball.vy * 0.9;
    } else {
      gameState = 'gameover';
    }
  }
  if (ball.x < sx) {
    opponentScore++;
    checkGameOver();
    resetBall();
  }
  if (ball.x > sx + TENNIS_COURT_W) {
    playerScore++;
    checkGameOver();
    resetBall();
  }
  if (ball.bounces > 10) {
    if (ball.x < sx + TENNIS_COURT_W / 2) opponentScore++;
    else playerScore++;
    checkGameOver();
    resetBall();
  }
}

function checkGameOver() {
  if (currentGame.player >= 4 && currentGame.player - currentGame.opponent >= 2) {
    gamesWon.player++;
    if (gamesWon.player >= 3) endGame('Player', playerScore, opponentScore);
  } else if (currentGame.opponent >= 4 && currentGame.opponent - currentGame.player >= 2) {
    gamesWon.opponent++;
    if (gamesWon.opponent >= 3) endGame('Computer', playerScore, opponentScore);
  }
}

function resetBall() {
  ball.x = W / 2;
  ball.y = H / 2;
  ball.vx = 0;
  ball.vy = 0;
  ball.inPlay = false;
  ball.bounces = 0;
  currentGame.player = 0;
  currentGame.opponent = 0;
}

function endGame(winner, pScore, oScore) {
  gameState = 'gameover';
  gamesWon[winner.toLowerCase()]++;
  if (gamesWon[winner.toLowerCase()] >= 3) {
    winnerText.textContent = winner + ' won the match!';
    finalScore.textContent = gamesWon.player + ' - ' + gamesWon.opponent;
    showGameOver();
  } else {
    currentGame = { player: 0, opponent: 0 };
    resetBall();
    gameState = 'playing';
  }
}

function showGameOver() {
  document.getElementById('gameOverScreen').style.display = 'flex';
}

function swingBall(direction) {
  if (swingCooldown > 0 || !ball.inPlay) return;
  swinging = true;
  swingingTimer = 30;
  ball.vx = direction * 800;
  ball.vy = -400;
  ball.inPlay = true;
  swingCooldown = 120;
}

function update() {
  const dt = Math.min(0.033, (performance.now() - lastTime) / 1000);
  lastTime = performance.now();

  // Move player towards touch/mouse/drag
  if (touchX !== null) {
    playerX = touchX;
  }
  if (opponentX !== null) {
    opponentX = opponentX + (ball.x - opponentX) * 0.05 * dt * 60;
    opponentY = H - 100 - (ball.y - opponentY) * 0.03 * dt * 60;
    if (opponentX < 40) opponentX = 40;
    if (opponentX > W - 40) opponentX = W - 40;
    if (opponentY > H - 120) opponentY = H - 120;
  }

  // Swing timer
  if (swinging) {
    swingingTimer -= dt * 60;
    playerRacketAngle += dt * 300;
    if (swingingTimer <= 0) swinging = false;
  }
  if (swingCooldown > 0) swingCooldown -= dt * 60;

  // Ball physics
  updateBall();

  // Update UI
  updateScore();

  // Draw
  drawCourt();
  drawNet();
  drawBall();
  drawPlayer(playerX, playerY, '#00ff00');
  drawPlayer(opponentX, opponentY, '#0066ff');
  drawRacket(playerX, playerY, playerRacketAngle, '#00ff00');
  drawRacket(opponentX, opponentY, 0, '#0066ff');
}

function updateScore() {
  const p = currentGame.player;
  const o = currentGame.opponent;
  let scoreText = '0 - 0';
  if (p === 15) scoreText = '15 - 0';
  else if (p === 30) scoreText = '30 - 0';
  else if (p === 40) scoreText = '40 - 0';
  else if (o === 15) scoreText = '0 - 15';
  else if (o === 30) scoreText = '0 - 30';
  else if (o === 40) scoreText = '0 - 40';
  else if (p === 40 && o === 40) scoreText = 'Deuce';
  else if (p > 0 && p - o === 1 && p === 40) scoreText = 'Advantage Player';
  else if (o > 0 && o - p === 1 && o === 40) scoreText = 'Advantage Computer';
  document.getElementById('score').textContent = scoreText + '   |   Games: ' + gamesWon.player + ' - ' + gamesWon.opponent;
}

let touchX = null;
canvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchX = t.clientX;
  playerX = worldToScreen(t.clientX, t.clientY).sx - TENNIS_COURT_W / 2;
  if (playerX < 0) playerX = 0;
  if (playerX > TENNIS_COURT_W - 60) playerX = TENNIS_COURT_W - 60;
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  touchX = t.clientX;
  playerX = worldToScreen(t.clientX, t.clientY).sx - TENNIS_COURT_W / 2;
  if (playerX < 0) playerX = 0;
  if (playerX > TENNIS_COURT_W - 60) playerX = TENNIS_COURT_W - 60;
}, { passive: true });
canvas.addEventListener('touchend', () => {
  touchX = null;
});
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  touchX = e.clientX - rect.left;
  playerX = worldToScreen(touchX, H / 2).sx - TENNIS_COURT_W / 2;
  if (playerX < 0) playerX = 0;
  if (playerX > TENNIS_COURT_W - 60) playerX = TENNIS_COURT_W - 60;
});
canvas.addEventListener('mouseup', () => {
  touchX = null;
});

let pressingLeft = false, pressingRight = false, pressingSwing = false;
document.getElementById('btnLeft').addEventListener('mousedown', () => pressingLeft = true);
document.getElementById('btnRight').addEventListener('mousedown', () => pressingRight = true);
document.getElementById('btnSwing').addEventListener('mousedown', () => pressingSwing = true);
document.querySelectorAll('button').forEach(b => b.addEventListener('mouseup', () => {
  if (b.id === 'btnLeft') pressingLeft = false;
  if (b.id === 'btnRight') pressingRight = false;
  if (b.id === 'btnSwing') pressingSwing = false;
}));
document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); pressingLeft = true; });
document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); pressingRight = true; });
document.getElementById('btnSwing').addEventListener('touchstart', (e) => { e.preventDefault(); pressingSwing = true; });
document.querySelectorAll('button').forEach(b => b.addEventListener('touchend', () => {
  if (b.id === 'btnLeft') pressingLeft = false;
  if (b.id === 'btnRight') pressingRight = false;
  if (b.id === 'btnSwing') pressingSwing = false;
}));

function startGame() {
  if (gameState !== 'start') return;
  gameState = 'playing';
  resetBall();
  showStartScreen(false);
  showGameOverScreen(false);
  // Randomize first serve
  ball.vx = Math.random() > 0.5 ? 400 : -400;
  ball.vy = -400;
  ball.inPlay = true;
}
function showStartScreen(show) {
  document.getElementById('startScreen').style.display = show ? 'flex' : 'none';
}
function showGameOverScreen(show) {
  document.getElementById('gameOverScreen').style.display = show ? 'flex' : 'none';
}

document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('restartBtn2').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => {
  if (gameState === 'start' && (e.code === 'Enter' || e.code === 'Space')) {
    e.preventDefault();
    startGame();
  }
  if (gameState === 'gameover' && (e.code === 'Enter' || e.code === 'Space')) {
    e.preventDefault();
    startGame();
  }
  if (gameState !== 'start' && e.code === 'ArrowLeft' && !pressingLeft) pressingLeft = true;
  if (gameState !== 'start' && e.code === 'ArrowRight' && !pressingRight) pressingRight = true;
  if (gameState !== 'start' && e.code === 'ArrowLeft' && pressingLeft) playerX -= 200 * dt;
  if (gameState !== 'start' && e.code === 'ArrowRight' && pressingRight) playerX += 200 * dt;
  if (gameState !== 'start' && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW')) {
    if (!pressingSwing) { pressingSwing = true; swingBall(1); }
  } else if (gameState !== 'start' && (e.code === 'Space' || e.code === 'ArrowDown' || e.code === 'KeyS')) {
    if (!pressingSwing) { pressingSwing = true; swingBall(-1); }
  }
  if (gameState !== 'start') {
    if (e.code === 'ArrowLeft') pressingLeft = true;
    if (e.code === 'ArrowRight') pressingRight = true;
    if (e.code === 'Space') pressingSwing = true;
    if (e.code === 'ArrowLeft' && !pressingLeft) pressingLeft = false;
    if (e.code === 'ArrowRight' && !pressingRight) pressingRight = false;
    if (e.code === 'Space' && !pressingSwing) pressingSwing = false;
  }
  if (gameState !== 'start') {
    if (pressingLeft) playerX -= 300 * dt;
    if (pressingRight) playerX += 300 * dt;
    if (pressingSwing && swingCooldown <= 0 && ball.inPlay && Math.abs(ball.vx) < 600) {
      swingBall(pressingRight ? 1 : -1);
      pressingSwing = false;
    }
  }
});

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
