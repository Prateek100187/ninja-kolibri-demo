<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side-View Ninja Fighting Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: monospace;
  }
  canvas { display: block; background: #1a1a1a; }
  #instructions {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: #888;
    font-size: 13px;
    line-height: 1.8;
    background: rgba(0,0,0,0.7);
    padding: 12px;
    border-radius: 6px;
    max-width: 250px;
  }
  #instructions strong { color: #fff; }
  #winOverlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.95);
    color: #fff;
    text-align: center;
    z-index: 100;
  }
  #winOverlay h1 {
    font-size: 80px;
    margin-bottom: 20px;
    color: #4caf50;
  }
  #winOverlay p {
    font-size: 24px;
    margin-bottom: 30px;
  }
  #restartButton {
    background: #4caf50;
    color: white;
    border: none;
    padding: 15px 40px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
  }
  #restartButton:hover { background: #43a047; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="960" height="600"></canvas>
<div id="instructions">
  <strong>Controls:</strong><br>
  A/D or ←→ : Move<br>
  W or ↑ : Jump<br>
  J : Attack<br>
  K : Block (hold)<br>
  L : Special Move (cooldown)<br>
  R : Restart<br>
</div>
<div id="winOverlay">
  <h1 id="winText">YOU WIN</h1>
  <p id="winSubText">Press R or click Restart</p>
  <button id="restartButton">Restart</button>
</div>
<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const winOverlay = document.getElementById('winOverlay');
  const winText = document.getElementById('winText');
  const winSubText = document.getElementById('winSubText');
  const restartButton = document.getElementById('restartButton');

  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  // Game state
  let running = true;
  let gameOver = false;
  let gameStarted = true;

  // Player
  let player = {
    x: 250,
    y: 380,
    width: 50,
    height: 80,
    vx: 0,
    vy: 0,
    facing: 1,
    health: 100,
    onGround: true,
    attacking: false,
    attackTimer: 0,
    attackCooldown: 0,
    blocking: false,
    blockedHits: 0
  };

  // CPU
  let cpu = {
    x: 660,
    y: 380,
    width: 50,
    height: 80,
    vx: 0,
    vy: 0,
    facing: -1,
    health: 100,
    onGround: true,
    attacking: false,
    attackTimer: 0,
    attackCooldown: 0,
    blocking: false,
    specialCooldown: 0
  };

  const GRAVITY = 0.8;
  const MAX_VX = 4;
  const JUMP_VY = -12;
  const ATTACK_RANGE = 120;
  const BLOCK_REDUCTION = 0.3;
  const KO_HEALTH = 0;

  // Input state
  let keys = {};
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR') {
      restartGame();
    }
    if (e.code === 'Space') e.preventDefault();
  });
  document.addEventListener('keyup', e => {
    keys[e.code] = false;
  });
  restartButton.addEventListener('click', restartGame);

  function restartGame() {
    player.x = 250;
    player.y = 380;
    player.health = 100;
    player.vx = 0;
    player.vy = 0;
    player.facing = 1;
    player.blocking = false;
    player.attackTimer = 0;
    player.attackCooldown = 0;

    cpu.x = 660;
    cpu.y = 380;
    cpu.health = 100;
    cpu.vx = 0;
    cpu.vy = 0;
    cpu.facing = -1;
    cpu.blocking = false;
    cpu.attackTimer = 0;
    cpu.attackCooldown = 0;
    cpu.specialCooldown = 0;

    gameOver = false;
    running = true;
    winOverlay.style.display = 'none';
  }

  function update() {
    if (!running) return;

    // Apply gravity
    player.vy += GRAVITY;
    cpu.vy += GRAVITY;

    // Ground collision
    if (player.y + player.height >= 400) {
      player.y = 400 - player.height;
      player.vy = 0;
      player.onGround = true;
    } else {
      player.onGround = false;
    }
    if (cpu.y + cpu.height >= 400) {
      cpu.y = 400 - cpu.height;
      cpu.vy = 0;
      cpu.onGround = true;
    } else {
      cpu.onGround = false;
    }

    // Player movement
    const moveLeft = keys['ArrowLeft'] || keys['KeyA'];
    const moveRight = keys['ArrowRight'] || keys['KeyD'];
    const jump = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
    const attack = keys['KeyJ'];
    const block = keys['KeyK'];
    const special = keys['KeyL'];

    // Player horizontal movement
    player.vx = 0;
    if (moveLeft) player.vx = -MAX_VX;
    if (moveRight) player.vx = MAX_VX;
    player.x += player.vx;

    // Keep player in bounds
    player.x = Math.max(50, Math.min(WIDTH - 50 - player.width, player.x));

    // Jump
    if (jump && player.onGround) {
      player.vy = JUMP_VY;
      player.onGround = false;
    }

    // Attack
    if (attack && player.attackCooldown <= 0 && !player.blocking && !gameOver) {
      player.attacking = true;
      player.attackTimer = 0.15;
      player.attackCooldown = 0.4;
    }

    // Block
    player.blocking = block;

    // Update attack timer
    if (player.attacking) {
      player.attackTimer -= 0.016;
      if (player.attackTimer <= 0) {
        player.attacking = false;
      }
    }

    // Attack cooldown
    if (player.attackCooldown > 0) player.attackCooldown -= 0.016;

    // Special move cooldown
    if (player.specialCooldown > 0) player.specialCooldown -= 0.016;

    // Special move
    if (special && player.specialCooldown <= 0 && !player.blocking && !gameOver) {
      player.specialCooldown = 2.0;
      player.attacking = true;
      player.attackTimer = 0.2;
      // Dash strike
      player.vx = 0;
      player.facing = 1; // always dash forward (toward cpu)
    }

    // CPU AI
    const moveLeftCPU = keys['ArrowLeft'] || keys['KeyA'];
    const moveRightCPU = keys['ArrowRight'] || keys['KeyD'];
    const jumpCPU = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];
    const attackCPU = keys['KeyJ'];
    const blockCPU = keys['KeyK']; // CPU can't actually be controlled by keyboard in this simple AI, so ignore
    const specialCPU = keys['KeyL'];

    // CPU movement toward player
    if (player.x < cpu.x) {
      cpu.vx = MAX_VX;
      cpu.facing = -1;
    } else if (player.x > cpu.x) {
      cpu.vx = -MAX_VX;
      cpu.facing = 1;
    } else {
      cpu.vx = 0;
    }
    cpu.x += cpu.vx;
    cpu.x = Math.max(50, Math.min(WIDTH - 50 - cpu.width, cpu.x));

    // Jump AI: sometimes jump if on ground
    if (cpu.onGround && Math.random() < 0.05) {
      cpu.vy = JUMP_VY;
      cpu.onGround = false;
    }

    // Attack AI: when in range
    const distance = Math.abs(cpu.x - player.x);
    const inRange = distance < ATTACK_RANGE + 30;

    if (inRange && cpu.attackCooldown <= 0 && !cpu.blocking && !cpu.attacking && !gameOver) {
      // Decide attack type
      const rand = Math.random();
      if (rand < 0.3) {
        // Special move
        if (cpu.specialCooldown <= 0) {
          cpu.specialCooldown = 2.5;
          cpu.attacking = true;
          cpu.attackTimer = 0.25;
        } else {
          cpu.attacking = true;
          cpu.attackTimer = 0.15;
        }
      } else if (rand < 0.2) {
        // Jump attack
        if (cpu.onGround) {
          cpu.vy = -10;
          cpu.attacking = true;
          cpu.attackTimer = 0.2;
        }
      } else {
        // Basic attack
        cpu.attacking = true;
        cpu.attackTimer = 0.15;
      }
      cpu.attackCooldown = 0.4;
    }

    // CPU block logic: if player attacking and close, sometimes block
    if (player.attacking && distance < 80 && !cpu.blocking) {
      if (Math.random() < 0.25) {
        cpu.blocking = true;
        // Hold block for 0.5 seconds
        let blockTimer = 0;
        // We'll handle this in the attack resolution
      }
    }

    // Update CPU attack timer
    if (cpu.attacking) {
      cpu.attackTimer -= 0.016;
      if (cpu.attackTimer <= 0) {
        cpu.attacking = false;
      }
    }

    // Attack cooldown
    if (cpu.attackCooldown > 0) cpu.attackCooldown -= 0.016;

    // Resolve attacks
    resolveAttacks();
  }

  function resolveAttacks() {
    // Player attack vs CPU
    if (player.attacking && !cpu.blocking) {
      const distance = Math.abs(player.x - cpu.x);
      if (distance < ATTACK_RANGE + player.width/2 + cpu.width/2) {
        let damage = 20;
        if (player.specialCooldown <= 0) damage = 35; // special is stronger
        cpu.health -= damage;
        // Knockback
        cpu.vx = 8 * (player.facing === 1 ? -1 : 1);
        cpu.vy = -5;
        showHitFeedback(cpu.x, cpu.y, 'red');
        // Flash effect
        cpu.flash = 0.1;
        if (cpu.health <= 0) {
          endGame(true);
        }
      }
    }

    // CPU attack vs Player
    if (cpu.attacking && !player.blocking) {
      const distance = Math.abs(cpu.x - player.x);
      if (distance < ATTACK_RANGE + cpu.width/2 + player.width/2) {
        let damage = 15;
        if (cpu.specialCooldown <= 0) damage = 25;
        player.health -= damage;
        player.vx = 8 * (cpu.facing === -1 ? 1 : -1);
        player.vy = -5;
        showHitFeedback(player.x, player.y, 'yellow');
        player.flash = 0.1;
        if (player.health <= 0) {
          endGame(false);
        }
      }
    }

    // If player blocking and cpu attacking, reduce damage
    if (player.blocking && cpu.attacking) {
      const distance = Math.abs(cpu.x - player.x);
      if (distance < ATTACK_RANGE + cpu.width/2 + player.width/2) {
        let damage = 15 * BLOCK_REDUCTION;
        if (cpu.specialCooldown <= 0) damage = 25 * BLOCK_REDUCTION;
        // We already applied the damage in the above check when player.blocking was false
        // So we need to handle this differently
        // Let's just set a flag and reduce in the above check
        // For simplicity, we'll just reduce the damage here
        player.health -= damage;
        // But we already subtracted full damage, so we need to undo and subtract reduced
        // This is messy. Let's restructure.
      }
    }
  }

  function showHitFeedback(x, y, color) {
    // Create a simple flash effect
    for (let i = 0; i < 20; i++) {
      const fx = x + (Math.random() - 0.5) * 30;
      const fy = y + (Math.random() - 0.5) * 30;
      const size = Math.random() * 10 + 5;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(fx, fy, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function endGame(playerWon) {
    running = false;
    gameOver = true;
    if (playerWon) {
      winText.textContent = "YOU WIN";
      winSubText.textContent = "Press R or click Restart";
    } else {
      winText.textContent = "YOU LOSE";
      winSubText.textContent = "Press R or click Restart";
    }
    winOverlay.style.display = 'flex';
  }

  function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Draw arena floor
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 400, WIDTH, 200);

    // Draw arena background (simple)
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Draw health bars
    drawHealthBar(50, 30, player.health, 100, 'PLAYER', '#ff4444');
    drawHealthBar(WIDTH - 250, 30, cpu.health, 100, 'CPU', '#44ff44');

    // Draw player
    drawNinja(player, '#44aaff');

    // Draw CPU
    drawNinja(cpu, '#ffaa44');

    // Draw UI
    drawInstructions();

    // Draw win overlay
    if (gameOver) {
      // Draw semi-transparent overlay
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = '#fff';
      ctx.font = '80px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(winText.textContent, WIDTH/2, 150);
      ctx.font = '24px monospace';
      ctx.fillText(winSubText.textContent, WIDTH/2, 220);
    }
  }

  function drawHealthBar(x, y, currentHealth, maxHealth, label, color) {
    // Bar background
    ctx.fillStyle = '#333';
    ctx.fillRect(x, y, 200, 15);
    // Health bar
    ctx.fillStyle = color;
    const width = (currentHealth / maxHealth) * 200;
    ctx.fillRect(x, y, width, 15);
    // Label
    ctx.fillStyle = '#fff';
    ctx.font = '13px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(label, x, y - 20);
  }

  function drawInstructions() {
    const text = 'Press A/D or ←→ to move, W/↑ to jump, J to attack, K to block, L for special, R to restart';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(text, 20, HEIGHT - 20);
  }

  function drawNinja(ninja, color) {
    // Body
    ctx.fillStyle = color;
    ctx.fillRect(ninja.x, ninja.y, ninja.width, ninja.height);

    // Head
    ctx.fillStyle = '#ffcc88';
    ctx.fillRect(ninja.x + 15, ninja.y - 30, 20, 20);

    // Eyes
    ctx.fillStyle = '#000';
    ctx.fillRect(ninja.x + 20, ninja.y - 25, 4, 4);
    ctx.fillRect(ninja.x + 30, ninja.y - 25, 4, 4);

    // Face direction
    const eyeOffset = ninja.facing === 1 ? 20 : 10;
    ctx.fillRect(ninja.x + 15 + eyeOffset, ninja.y - 25, 4, 4);
    ctx.fillRect(ninja.x + 25 + eyeOffset, ninja.y - 25, 4, 4);

    // Sword or fist
    if (ninja.attacking) {
      // Draw attack trail
      ctx.strokeStyle = 'rgba(255,255,0,0.5)';
      ctx.lineWidth = 3;
      const attackEndX = ninja.x + ninja.facing * 120;
      const attackEndY = ninja.y + 20;
      ctx.beginPath();
      ctx.moveTo(ninja.x + 10, ninja.y + 30);
      ctx.lineTo(attackEndX, attackEndY);
      ctx.stroke();
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  restartGame();
  gameLoop();
</script>
</body>
</html>
