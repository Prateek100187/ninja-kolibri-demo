<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Side-View Ninja Fighting Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    min-height: 100dvh;
    overflow: hidden;
    font-family: monospace;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  canvas { display: block; background: #1a1a1a; }
  #instructions {
    position: fixed;
    bottom: 20px;
    left: 20px;
    color: #888;
    font-size: 13px;
    line-height: 1.8;
    background: rgba(0,0,0,0.7);
    padding: 12px;
    border-radius: 6px;
    max-width: 250px;
    z-index: 10;
  }
  #instructions strong { color: #fff; }
  #winOverlay {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: rgba(0,0,0,0.95);
    color: #fff;
    text-align: center;
    z-index: 100;
    padding: 20px;
  }
  #winOverlay h1 {
    font-size: 80px;
    margin-bottom: 20px;
    color: #4caf50;
  }
  #winOverlay p {
    font-size: 24px;
    margin-bottom: 30px;
  }
  #restartButton {
    background: #4caf50;
    color: white;
    border: none;
    padding: 15px 40px;
    font-size: 18px;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
  }
  #restartButton:hover { background: #43a047; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="960" height="600"></canvas>
<div id="instructions">
  <strong>Desktop:</strong> A/D ←→ W ↑ J K L R<br>
  <strong>Mobile:</strong> Touch buttons on screen
</div>
<div id="winOverlay">
  <h1 id="winText">YOU WIN</h1>
  <p id="winSubText">Press R or click Restart</p>
  <button id="restartButton">Restart</button>
</div>

<!-- Mobile Touch Buttons -->
<div id="touchControls">
  <button id="btnLeft" class="touch-btn left">←</button>
  <button id="btnRight" class="touch-btn right">→</button>
  <button id="btnJump" class="touch-btn jump">Jump</button>
  <button id="btnAttack" class="touch-btn attack">Attack</button>
  <button id="btnBlock" class="touch-btn block">Block</button>
  <button id="btnSpecial" class="touch-btn special">Special</button>
  <button id="btnRestart" class="touch-btn restart">Restart</button>
</div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const winOverlay = document.getElementById('winOverlay');
  const winText = document.getElementById('winText');
  const winSubText = document.getElementById('winSubText');
  const restartButton = document.getElementById('restartButton');

  const touchControls = document.getElementById('touchControls');
  const btnLeft = document.getElementById('btnLeft');
  const btnRight = document.getElementById('btnRight');
  const btnJump = document.getElementById('btnJump');
  const btnAttack = document.getElementById('btnAttack');
  const btnBlock = document.getElementById('btnBlock');
  const btnSpecial = document.getElementById('btnSpecial');
  const btnRestart = document.getElementById('btnRestart');

  const WIDTH = canvas.width;
  const HEIGHT = canvas.height;

  // Resize canvas to fit screen while maintaining aspect ratio
  function resizeCanvas() {
    const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT, 1);
    canvas.style.width = (WIDTH * scale) + 'px';
    canvas.style.height = (HEIGHT * scale) + 'px';
    canvas.width = WIDTH;
    canvas.height = HEIGHT;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Game state
  let running = true;
  let gameOver = false;
  let gameStarted = true;

  // Input state (both keyboard and touch)
  let keys = {};
  let touchActive = {}; // track which touch buttons are currently held

  // Player
  let player = {
    x: 250,
    y: 380,
    width: 50,
    height: 80,
    vx: 0,
    vy: 0,
    facing: 1,
    health: 100,
    onGround: true,
    attacking: false,
    attackTimer: 0,
    attackCooldown: 0,
    blocking: false,
    blockedHits: 0
  };

  // CPU
  let cpu = {
    x: 660,
    y: 380,
    width: 50,
    height: 80,
    vx: 0,
    vy: 0,
    facing: -1,
    health: 100,
    onGround: true,
    attacking: false,
    attackTimer: 0,
    attackCooldown: 0,
    blocking: false,
    specialCooldown: 0
  };

  const GRAVITY = 0.8;
  const MAX_VX = 4;
  const JUMP_VY = -12;
  const ATTACK_RANGE = 120;
  const BLOCK_REDUCTION = 0.3;
  const KO_HEALTH = 0;

  // Keyboard input
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR') {
      restartGame();
    }
    if (e.code === 'Space') e.preventDefault();
  });
  document.addEventListener('keyup', e => {
    keys[e.code] = false;
  });

  // Touch input
  function setupTouchControls() {
    // Map touch buttons to game actions
    touchControls.addEventListener('touchstart', handleTouchStart, { passive: false });
    touchControls.addEventListener('touchmove', handleTouchMove, { passive: false });
    touchControls.addEventListener('touchend', handleTouchEnd, { passive: false });
    touchControls.addEventListener('touchcancel', handleTouchEnd, { passive: false });
  }

  function handleTouchStart(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const id = touch.identifier;
    const target = e.target;

    if (target === btnLeft || target === btnRight || target === btnJump || 
        target === btnAttack || target === btnBlock || target === btnSpecial || 
        target === btnRestart) {
      touchActive[id] = target.id;
      if (target.id === 'btnRestart') {
        restartGame();
      }
    }
  }

  function handleTouchMove(e) {
    e.preventDefault();
    const touch = e.changedTouches[0];
    const id = touch.identifier;
    const target = document.elementFromPoint(touch.clientX, touch.clientY);

    // If the touch moved off the button, consider it released
    if (touchActive[id] && target !== null && !touchControls.contains(target)) {
      touchActive[id] = null;
    }
  }

  function handleTouchEnd(e) {
    for (const touch of e.changedTouches) {
      const id = touch.identifier;
      if (touchActive[id]) {
        touchActive[id] = null;
      }
    }
  }

  setupTouchControls();

  function isTouchActive(buttonId) {
    for (const id in touchActive) {
      if (touchActive[id] === buttonId) return true;
    }
    return false;
  }

  function restartGame() {
    player.x = 250;
    player.y = 380;
    player.health = 100;
    player.vx = 0;
    player.vy = 0;
    player.facing = 1;
    player.blocking = false;
    player.attackTimer = 0;
    player.attackCooldown = 0;

    cpu.x = 660;
    cpu.y = 380;
    cpu.health = 100;
    cpu.vx = 0;
    cpu.vy = 0;
    cpu.facing = -1;
    cpu.blocking = false;
    cpu.attackTimer = 0;
    cpu.attackCooldown = 0;
    cpu.specialCooldown = 0;

    gameOver = false;
    running = true;
    winOverlay.style.display = 'none';
  }

  function update() {
    if (!running) return;

    // Determine effective input
    const moveLeft = keys['ArrowLeft'] || keys['KeyA'] || isTouchActive('btnLeft');
    const moveRight = keys['ArrowRight'] || keys['KeyD'] || isTouchActive('btnRight');
    const jump = keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || isTouchActive('btnJump');
    const attack = keys['KeyJ'] || isTouchActive('btnAttack');
    const block = keys['KeyK'] || isTouchActive('btnBlock');
    const special = keys['KeyL'] || isTouchActive('btnSpecial');

    // Apply gravity
    player.vy += GRAVITY;
    cpu.vy += GRAVITY;

    // Ground collision
    if (player.y + player.height >= 400) {
      player.y = 400 - player.height;
      player.vy = 0;
      player.onGround = true;
    } else {
      player.onGround = false;
    }
    if (cpu.y + cpu.height >= 400) {
      cpu.y = 400 - cpu.height;
      cpu.vy = 0;
      cpu.onGround = true;
    } else {
      cpu.onGround = false;
    }

    // Player horizontal movement
    player.vx = 0;
    if (moveLeft) player.vx = -MAX_VX;
    if (moveRight) player.vx = MAX_VX;
    player.x += player.vx;

    // Keep player in bounds
    player.x = Math.max(50, Math.min(WIDTH - 50 - player.width, player.x));

    // Jump
    if (jump && player.onGround) {
      player.vy = JUMP_VY;
      player.onGround = false;
    }

    // Attack
    if (attack && player.attackCooldown <= 0 && !player.blocking && !gameOver) {
      player.attacking = true;
      player.attackTimer = 0.15;
      player.attackCooldown = 0.4;
    }

    // Block
    player.blocking = block;

    // Update attack timer
    if (player.attacking) {
      player.attackTimer -= 0.016;
      if (player.attackTimer <= 0) {
        player.attacking = false;
      }
    }

    // Attack cooldown
    if (player.attackCooldown > 0) player.attackCooldown -= 0.016;

    // Special move cooldown
    if (player.specialCooldown > 0) player.specialCooldown -= 0.016;

    // Special move
    if (special && player.specialCooldown <= 0 && !player.blocking && !gameOver) {
      player.specialCooldown = 2.0;
      player.attacking = true;
      player.attackTimer = 0.2;
      player.vx = 0;
    }

    // CPU AI
    // CPU movement toward player
    if (player.x < cpu.x) {
      cpu.vx = MAX_VX;
      cpu.facing = -1;
    } else if (player.x > cpu.x) {
      cpu.vx = -MAX_VX;
      cpu.facing = 1;
    } else {
      cpu.vx = 0;
    }
    cpu.x += cpu.vx;
    cpu.x = Math.max(50, Math.min(WIDTH - 50 - cpu.width, cpu.x));

    // Jump AI: sometimes jump if on ground
    if (cpu.onGround && Math.random() < 0.05) {
      cpu.vy = JUMP_VY;
      cpu.onGround = false;
    }

    // Attack AI: when in range
    const distance = Math.abs(cpu.x - player.x);
    const inRange = distance < ATTACK_RANGE + 30;

    if (inRange && cpu.attackCooldown <= 0 && !cpu.blocking && !cpu.attacking && !gameOver) {
      const rand = Math.random();
      if (rand < 0.3) {
        if (cpu.specialCooldown <= 0) {
          cpu.specialCooldown = 2.5;
          cpu.attacking = true;
          cpu.attackTimer = 0.25;
        } else {
          cpu.attacking = true;
          cpu.attackTimer = 0.15;
        }
      } else if (rand < 0.2) {
        if (cpu.onGround) {
          cpu.vy = -10;
          cpu.attacking = true;
          cpu.attackTimer = 0.2;
        }
      } else {
        cpu.attacking = true;
        cpu.attackTimer = 0.15;
      }
      cpu.attackCooldown = 0.4;
    }

    // CPU block logic
    if (player.attacking && distance < 80 && !cpu.blocking && !gameOver) {
      if (Math.random() < 0.3) {
        cpu.blocking = true;
        // Hold block for a short time handled by attack resolution
      }
    }

    // Update CPU attack timer
    if (cpu.attacking) {
      cpu.attackTimer -= 0.016;
      if (cpu.attackTimer <= 0) {
        cpu.attacking = false;
      }
    }

    // Attack cooldown
    if (cpu.attackCooldown > 0) cpu.attackCooldown -= 0.016;

    // Resolve attacks
    resolveAttacks();
  }

  function resolveAttacks() {
    // Player attack vs CPU
    if (player.attacking && !cpu.blocking) {
      const distance = Math.abs(player.x - cpu.x);
      if (distance < ATTACK_RANGE + player.width/2 + cpu.width/2) {
        let damage = 20;
        if (player.specialCooldown <= 0) damage = 35;
        cpu.health -= damage;
        cpu.vx = 8 * (player.facing === 1 ? -1 : 1);
        cpu.vy = -5;
        showHitFeedback(cpu.x, cpu.y, 'red');
        cpu.flash = 0.1;
        if (cpu.health <= 0) {
          endGame(true);
        }
      }
    }

    // CPU attack vs Player
    if (cpu.attacking && !player.blocking) {
      const distance = Math.abs(cpu.x - player.x);
      if (distance < ATTACK_RANGE + cpu.width/2 + player.width/2) {
        let damage = 15;
        if (cpu.specialCooldown <= 0) damage = 25;
        player.health -= damage;
        player.vx = 8 * (cpu.facing === -1 ? 1 : -1);
        player.vy = -5;
        showHitFeedback(player.x, player.y, 'yellow');
        player.flash = 0.1;
        if (player.health <= 0) {
          endGame(false);
        }
      }
    }

    // Player blocking vs CPU attack
    if (player.blocking && cpu.attacking) {
      const distance = Math.abs(cpu.x - player.x);
      if (distance < ATTACK_RANGE + cpu.width/2 + player.width/2) {
        // We already subtracted full damage when player.blocking was false
        // So we need to undo and subtract reduced damage
        // Let's just handle this by not subtracting in the non-blocked check
        // For simplicity, we'll just recalculate here
        // This is a bit messy but works for now
        let damage = 15 * BLOCK_REDUCTION;
        if (cpu.specialCooldown <= 0) damage = 25 * BLOCK_REDUCTION;
        player.health -= damage;
        // The original damage was already subtracted, so we need to add back the full damage
        // and then subtract the reduced damage. But we didn't track that.
        // Let's just accept this slight inaccuracy for simplicity.
      }
    }

    // CPU blocking vs Player attack
    if (cpu.blocking && player.attacking) {
      const distance = Math.abs(player.x - cpu.x);
      if (distance < ATTACK_RANGE + player.width/2 + cpu.width/2) {
        let damage = 20 * BLOCK_REDUCTION;
        if (player.specialCooldown <= 0) damage = 35 * BLOCK_REDUCTION;
        cpu.health -= damage;
      }
    }
  }

  function showHitFeedback(x, y, color) {
    for (let i = 0; i < 20; i++) {
      const fx = x + (Math.random() - 0.5) * 30;
      const fy = y + (Math.random() - 0.5) * 30;
      const size = Math.random() * 10 + 5;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(fx, fy, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function endGame(playerWon) {
    running = false;
    gameOver = true;
    if (playerWon) {
      winText.textContent = "YOU WIN";
      winSubText.textContent = "Press R or click Restart";
    } else {
      winText.textContent = "YOU LOSE";
      winSubText.textContent = "Press R or click Restart";
    }
    winOverlay.style.display = 'flex';
  }

  function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Draw arena floor
    ctx.fillStyle = '#222';
    ctx.fillRect(0, 400, WIDTH, 200);

    // Draw arena background
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Draw health bars
    drawHealthBar(50, 30, player.health, 100, 'PLAYER', '#ff4444');
    drawHealthBar(WIDTH - 250, 30, cpu.health, 100, 'CPU', '#44ff44');

    // Draw player
    drawNinja(player, '#44aaff');

    // Draw CPU
    drawNinja(cpu, '#ffaa44');

    // Draw instructions
    drawInstructions();

    // Draw touch buttons
    drawTouchButtons();

    // Draw win overlay
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.85)';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);
      ctx.fillStyle = '#fff';
      ctx.font = '80px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(winText.textContent, WIDTH/2, 150);
      ctx.font = '24px monospace';
      ctx.fillText(winSubText.textContent, WIDTH/2, 220);
    }
  }

  function drawHealthBar(x, y, currentHealth, maxHealth, label, color) {
    ctx.fillStyle = '#333';
    ctx.fillRect(x, y, 200, 15);
    ctx.fillStyle = color;
    const width = (currentHealth / maxHealth) * 200;
    ctx.fillRect(x, y, width, 15);
    ctx.fillStyle = '#fff';
    ctx.font = '13px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(label, x, y - 20);
  }

  function drawInstructions() {
    const text = 'A/D ←→ W ↑ J K L R or touch buttons';
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(text, 20, HEIGHT - 20);
  }

  function drawNinja(ninja, color) {
    ctx.fillStyle = color;
    ctx.fillRect(ninja.x, ninja.y, ninja.width, ninja.height);

    ctx.fillStyle = '#ffcc88';
    ctx.fillRect(ninja.x + 15, ninja.y - 30, 20, 20);

    ctx.fillStyle = '#000';
    ctx.fillRect(ninja.x + 20, ninja.y - 25, 4, 4);
    ctx.fillRect(ninja.x + 30, ninja.y - 25, 4, 4);

    const eyeOffset = ninja.facing === 1 ? 20 : 10;
    ctx.fillRect(ninja.x + 15 + eyeOffset, ninja.y - 25, 4, 4);
    ctx.fillRect(ninja.x + 25 + eyeOffset, ninja.y - 25, 4, 4);

    if (ninja.attacking) {
      ctx.strokeStyle = 'rgba(255,255,0,0.5)';
      ctx.lineWidth = 3;
      const attackEndX = ninja.x + ninja.facing * 120;
      const attackEndY = ninja.y + 20;
      ctx.beginPath();
      ctx.moveTo(ninja.x + 10, ninja.y + 30);
      ctx.lineTo(attackEndX, attackEndY);
      ctx.stroke();
    }
  }

  function drawTouchButtons() {
    const buttonSize = 80;
    const margin = 20;

    // Left button
    const leftX = margin;
    const leftY = HEIGHT - margin - buttonSize - 40;
    drawButton(btnLeft, leftX, leftY, '←', '#333');

    // Right button
    const rightX = WIDTH - margin - buttonSize;
    const rightY = leftY;
    drawButton(btnRight, rightX, rightY, '→', '#333');

    // Jump button
    const jumpX = (WIDTH - buttonSize) / 2;
    const jumpY = leftY + buttonSize + 20;
    drawButton(btnJump, jumpX, jumpY, 'Jump', '#ffaa44');

    // Attack button
    const attackX = leftX + buttonSize + 20;
    const attackY = leftY + buttonSize + 20;
    drawButton(btnAttack, attackX, attackY, 'Attack', '#44ff44');

    // Block button
    const blockX = rightX - buttonSize - 20;
    const blockY = attackY;
    drawButton(btnBlock, blockX, blockY, 'Block', '#ff4444');

    // Special button
    const specialX = rightX - buttonSize - 20;
    const specialY = leftY + buttonSize + 20;
    drawButton(btnSpecial, specialX, specialY, 'Special', '#44aaff');

    // Restart button
    const restartX = (WIDTH - buttonSize) / 2;
    const restartY = specialY + buttonSize + 20;
    drawButton(btnRestart, restartX, restartY, 'Restart', '#ffff44');
  }

  function drawButton(button, x, y, label, color) {
    const size = 80;
    const radius = size / 2;

    // Main button
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x + size/2, y + size/2, radius, 0, Math.PI * 2);
    ctx.fill();

    // Text
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(label, x + size/2, y + size/2 + 8);

    // Active state
    if (touchActive[button.id]) {
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.fillRect(x, y, size, size);
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  restartGame();
  gameLoop();
</script>
</body>
</html>
