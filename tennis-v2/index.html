<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lawn Tennis</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a3d2e; font-family: 'Helvetica Neue', Arial, sans-serif; }
canvas { display: block; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(26,61,46,0.92); color: #fff; text-align: center; }
#canvasWrapper { position: absolute; inset: 0; width: 100%; height: 100%; }
#courtCanvas { display: block; }
#buttons { position: absolute; bottom: 1vh; left: 50%; transform: translateX(-50%); display: flex; gap: 1.5vh; padding: 0.8vh; background: rgba(0,0,0,0.5); border-radius: 12px; }
button { width: 14vw; min-width: 80px; height: 16vh; min-height: 96px; border-radius: 20px; border: 3px solid #fff; background: rgba(255,255,255,0.1); color: #fff; font-size: 4.5vh; font-weight: bold; transition: transform 0.1s; }
button:active { transform: scale(0.95); box-shadow: 0 0 15px rgba(255,255,255,0.4); }
#restartBtn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 22vw; min-width: 110px; height: 16vh; min-height: 96px; font-size: 5vh; }
#score { position: absolute; top: 1.5vh; left: 50%; transform: translateX(-50%); font-size: 5.5vw; font-weight: bold; color: #fff; background: rgba(0,0,0,0.65); padding: 0.8vh 2.5vw; border-radius: 10px; white-space: nowrap; }
</style>
</head>
<body>
<div id="canvasWrapper">
  <canvas id="courtCanvas"></canvas>
</div>
<div id="score">0 - 0</div>

<div class="screen" id="startScreen">
  <h1>Lawn Tennis</h1>
  <p>First to 3 games wins.</p>
  <p>Laptop: ←/→ or A/D move, W/S forward/back, Space swing, Enter start.</p>
  <p>Phone: LEFT/RIGHT/SWING buttons, tap to play.</p>
  <button id="restartBtn">START</button>
</div>

<div class="screen" id="gameOverScreen" style="display:none;">
  <h1>Game Over</h1>
  <p id="winnerText">Player won!</p>
  <p id="finalScore">3 - 0</p>
  <button id="restartBtn2">RESTART</button>
</div>

<div id="buttons">
  <button id="btnLeft">LEFT</button>
  <button id="btnRight">RIGHT</button>
  <button id="btnSwing">SWING</button>
</div>

<script>
const canvas = document.getElementById('courtCanvas');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Game objects
let playerX = W / 2, playerY = H - 90;
let opponentX = W / 2, opponentY = 90;
let ball = { x: W / 2, y: H / 2, vx: 0, vy: 0, inPlay: false, bounces: 0, size: 12 };
let playerRacketAngle = 0;
let swinging = false, swingCooldown = 0;
let gameState = 'start';
let playerScore = 0, opponentScore = 0;
let gamesWon = { player: 0, opponent: 0 };
let currentGame = { player: 0, opponent: 0 };
let lastTime = 0;

// Canvas court dimensions (fixed proportion, centered)
const COURT_W = Math.min(W * 0.85, H * 0.6);
const COURT_H = COURT_W * 0.55;
const NET_Y = COURT_H / 2;
const NET_H = 1.05;

function worldToScreen(x, y) {
  const offsetX = (W - COURT_W) / 2;
  const offsetY = (H - COURT_H) / 2;
  return { sx: offsetX + x, sy: offsetY + y };
}

function drawCourt() {
  ctx.clearRect(0, 0, W, H);
  const { sx, sy } = worldToScreen(0, 0);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 5;
  ctx.strokeRect(sx, sy, COURT_W, COURT_H);
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(sx + COURT_W / 2, sy);
  ctx.lineTo(sx + COURT_W / 2, sy + COURT_H);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(sx + COURT_W * 0.25, sy);
  ctx.lineTo(sx + COURT_W * 0.75, sy);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(sx + COURT_W * 0.25, sy + COURT_H);
  ctx.lineTo(sx + COURT_W * 0.75, sy + COURT_H);
  ctx.stroke();
}

function drawBall() {
  const { sx, sy } = worldToScreen(ball.x, ball.y);
  const shadow = -ball.vy * 0.015;
  ctx.fillStyle = 'rgba(255, 255, 0, 0.5)';
  ctx.beginPath();
  ctx.arc(sx, sy + shadow + 4, 5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffea00';
  ctx.beginPath();
  ctx.arc(sx, sy + shadow, ball.size, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayer(x, y, color) {
  const { sx, sy } = worldToScreen(x, y);
  // Body
  ctx.strokeStyle = color;
  ctx.lineWidth = 14;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(sx, sy - 28);
  ctx.lineTo(sx - 10, sy - 8);
  ctx.lineTo(sx, sy - 3);
  ctx.lineTo(sx - 10, sy + 8);
  ctx.lineTo(sx, sy + 28);
  ctx.stroke();
  // Head
  ctx.beginPath();
  ctx.arc(sx, sy - 32, 13, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  // Racket (shown when not swinging too fast)
  drawRacket(sx, sy - 5, 0.4, color);
}

function drawRacket(sx, sy, angle, color) {
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(angle);
  ctx.strokeStyle = color;
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(50, 0);
  ctx.stroke();
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(50, 0, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawNet() {
  const { sx, sy } = worldToScreen(0, 0);
  const netX = sx + COURT_W / 2;
  const netTop = sy + NET_Y - NET_H / 2;
  const netBottom = sy + NET_Y + NET_H / 2;
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(netX - 3, netTop, 6, NET_H);
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(netX - 3, netTop);
  ctx.lineTo(netX - 3, netBottom);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(netX + 3, netTop);
  ctx.lineTo(netX + 3, netBottom);
  ctx.stroke();
}

function updateBall() {
  const { sx, sy } = worldToScreen(ball.x, ball.y);
  ball.x += ball.vx;
  ball.y += ball.vy;
  ball.vy += 3000;
  const bounceY = sy + COURT_H - ball.size;
  if (ball.y >= bounceY) {
    ball.y = bounceY;
    ball.vy = -ball.vy * 0.75;
    ball.bounces++;
    if (ball.bounces > 2) return ballOut();
  }
  const netCenterY = sy + NET_Y;
  if (ball.x > sx + COURT_W / 2 - ball.size && ball.x < sx + COURT_W / 2 + ball.size) {
    if (ball.y > netCenterY - NET_H / 2 && ball.y < netCenterY + NET_H / 2) {
      ball.x = sx + COURT_W / 2;
      ball.vy = -ball.vy * 0.9;
    } else {
      return ballOut();
    }
  }
  if (ball.x < sx) return ballOut('opponent');
  if (ball.x > sx + COURT_W) return ballOut('player');
  if (ball.bounces > 20) return ballOut('noReturn');
  return null;
}

function ballOut(who = 'player') {
  if (who === 'player') opponentScore++; else playerScore++;
  checkGameOver();
  resetBall();
  gameState = 'start';
  return true;
}

function checkGameOver() {
  if (currentGame.player >= 4 && currentGame.player - currentGame.opponent >= 2) {
    gamesWon.player++;
    if (gamesWon.player >= 3) endGame('Player');
  } else if (currentGame.opponent >= 4 && currentGame.opponent - currentGame.player >= 2) {
    gamesWon.opponent++;
    if (gamesWon.opponent >= 3) endGame('Computer');
  }
}

function resetBall() {
  ball.x = W / 2;
  ball.y = H / 2;
  ball.vx = 0;
  ball.vy = 0;
  ball.inPlay = false;
  ball.bounces = 0;
  currentGame.player = 0;
  currentGame.opponent = 0;
}

function endGame(winner) {
  gameState = 'gameover';
  gamesWon[winner.toLowerCase()]++;
  if (gamesWon[winner.toLowerCase()] >= 3) {
    winnerText.textContent = winner + ' won the match!';
    finalScore.textContent = gamesWon.player + ' - ' + gamesWon.opponent;
    showGameOverScreen(true);
  } else {
    currentGame = { player: 0, opponent: 0 };
    showGameOverScreen(false);
    resetBall();
    gameState = 'start';
  }
}

function showGameOverScreen(show) {
  document.getElementById('gameOverScreen').style.display = show ? 'flex' : 'none';
}

function swingBall(direction) {
  if (swingCooldown > 0 || !ball.inPlay) return;
  swinging = true;
  ball.vx = direction * 850;
  ball.vy = -450;
  ball.inPlay = true;
  swingCooldown = 100;
}

// Input state
let touchX = null;
canvas.addEventListener('touchstart', (e) => {
  const t = e.touches[0];
  touchX = t.clientX;
}, { passive: true });
canvas.addEventListener('touchmove', (e) => {
  const t = e.touches[0];
  touchX = t.clientX;
}, { passive: true });
canvas.addEventListener('touchend', () => { touchX = null; });
canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  touchX = e.clientX - rect.left;
});
canvas.addEventListener('mouseup', () => { touchX = null; });

let pressingLeft = false, pressingRight = false, pressingSwing = false;
document.getElementById('btnLeft').addEventListener('mousedown', () => pressingLeft = true);
document.getElementById('btnRight').addEventListener('mousedown', () => pressingRight = true);
document.getElementById('btnSwing').addEventListener('mousedown', () => pressingSwing = true);
document.querySelectorAll('button').forEach(b => b.addEventListener('mouseup', () => {
  if (b.id === 'btnLeft') pressingLeft = false;
  if (b.id === 'btnRight') pressingRight = false;
  if (b.id === 'btnSwing') pressingSwing = false;
}));
document.getElementById('btnLeft').addEventListener('touchstart', (e) => { e.preventDefault(); pressingLeft = true; });
document.getElementById('btnRight').addEventListener('touchstart', (e) => { e.preventDefault(); pressingRight = true; });
document.getElementById('btnSwing').addEventListener('touchstart', (e) => { e.preventDefault(); pressingSwing = true; });
document.querySelectorAll('button').forEach(b => b.addEventListener('touchend', () => {
  if (b.id === 'btnLeft') pressingLeft = false;
  if (b.id === 'btnRight') pressingRight = false;
  if (b.id === 'btnSwing') pressingSwing = false;
}));

function startGame() {
  if (gameState !== 'start') return;
  gameState = 'playing';
  resetBall();
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameOverScreen').style.display = 'none';
  ball.vx = Math.random() > 0.5 ? 400 : -400;
  ball.vy = -400;
  ball.inPlay = true;
}
document.getElementById('restartBtn').addEventListener('click', startGame);
document.getElementById('restartBtn2').addEventListener('click', startGame);
document.addEventListener('keydown', (e) => {
  if ((gameState === 'start' || gameState === 'gameover') && (e.code === 'Enter' || e.code === 'Space')) {
    e.preventDefault();
    startGame();
  }
  if (gameState !== 'start') {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') pressingLeft = true;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') pressingRight = true;
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') pressingSwing = true;
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') pressingRight = false;
    if (e.code === 'ArrowRight' || e.code === 'KeyD') pressingLeft = false;
    if (e.code === 'Space') pressingSwing = false;
  }
});

let lastFrameTime = performance.now();
function loop() {
  const now = performance.now();
  const dt = Math.min(0.033, (now - lastFrameTime) / 1000);
  lastFrameTime = now;

  if (gameState === 'playing') {
    // Move player horizontally
    if (touchX !== null) {
      const rect = canvas.getBoundingClientRect();
      const sx = rect.left + touchX;
      const offsetX = (W - COURT_W) / 2;
      playerX = sx - offsetX;
      if (playerX < 0) playerX = 0;
      if (playerX > COURT_W - 50) playerX = COURT_W - 50;
    }
    if (pressingLeft) playerX -= 350 * dt;
    if (pressingRight) playerX += 350 * dt;
    if (playerX < 0) playerX = 0;
    if (playerX > COURT_W - 50) playerX = COURT_W - 50;

    // Move opponent toward ball
    const { sx, sy } = worldToScreen(0, 0);
    const targetX = ball.x;
    const targetY = ball.y;
    opponentX += (targetX - opponentX) * 0.04 * dt * 60;
    opponentY += (targetY - opponentY) * 0.03 * dt * 60;
    if (opponentX < 40) opponentX = 40;
    if (opponentX > COURT_W - 40) opponentX = COURT_W - 40;
    if (opponentY > COURT_H - 100) opponentY = COURT_H - 100;
    if (opponentY < 40) opponentY = 40;

    // Swing
    if (swinging) {
      playerRacketAngle += 350 * dt;
    }
    if (pressingSwing && swingCooldown <= 0 && ball.inPlay && Math.abs(ball.vx) < 700) {
      swingBall(pressingRight ? 1 : -1);
      pressingSwing = false;
    }
    if (swingCooldown > 0) swingCooldown -= 60 * dt;
    if (swingingTimerFallback) swingingTimerFallback -= 60 * dt;

    // Ball physics
    const out = updateBall();
    if (out && !ball.inPlay) {
      // Ball out, reset to serving position
      resetBall();
    }
  }

  // Score
  const p = currentGame.player;
  const o = currentGame.opponent;
  let scoreText = '0 - 0';
  if (p === 15 && o === 0) scoreText = '15 - 0';
  else if (p === 30 && o === 0) scoreText = '30 - 0';
  else if (p === 40 && o === 0) scoreText = '40 - 0';
  else if (p === 15 && o === 15) scoreText = '15 - 15';
  else if (p === 30 && o === 15) scoreText = '30 - 15';
  else if (p === 30 && o === 30) scoreText = '30 - 30';
  else if (p === 40 && o === 30) scoreText = '40 - 30';
  else if (o === 15 && p === 0) scoreText = '0 - 15';
  else if (o === 30 && p === 0) scoreText = '0 - 30';
  else if (o === 30 && p === 15) scoreText = '15 - 30';
  else if (o === 40 && p === 0) scoreText = '0 - 40';
  else if (o === 40 && p === 15) scoreText = '15 - 40';
  else if (o === 40 && p === 30) scoreText = '30 - 40';
  else if (p === 40 && o === 40) scoreText = 'Deuce';
  else if (p === 41) scoreText = 'Advantage Player';
  else if (o === 41) scoreText = 'Advantage Computer';
  document.getElementById('score').textContent = scoreText + '   |   Games: ' + gamesWon.player + ' - ' + gamesWon.opponent;

  draw();
  requestAnimationFrame(loop);
}

function draw() {
  drawCourt();
  drawNet();
  drawBall();
  drawPlayer(playerX, playerY, '#00ff00');
  drawPlayer(opponentX, opponentY, '#0066ff');
  drawRacket(playerX, playerY, swinging ? playerRacketAngle : 0.4, '#00ff00');
  drawRacket(opponentX, opponentY, 0, '#0066ff');
}

startGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
